services:
  medya-indirici:
    build:
      context: .
      dockerfile: Dockerfile
    image: medya-indirici:local
    container_name: medya-indirici
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: Europe/Istanbul
      PUPPETEER_CACHE_DIR: /app/.cache/puppeteer
    ports:
      - "3010:3000"
    volumes:
      - medya_indirici_downloads:/app/public/downloads
    shm_size: "1gb"

volumes:
  medya_indirici_downloads:
    name: medya_indirici_downloads
